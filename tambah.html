<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tambah Konten</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>
    CBM Content Manager
</header>



<div class="container">


<div class="card">


<div class="title">
➕ Tambah Konten
</div>


<p>
Isi data konten baru.
</p>



<label>
Judul Konten
</label>

<input 
type="text" 
id="judul"
placeholder="Masukkan judul konten">



<label>
Tanggal Bahan
</label>

<input 
type="date" 
id="tglBahan">



<label>
Tanggal Selesai Edit
</label>

<input 
type="date" 
id="tglEdit">



<label>
Tanggal Jadi
</label>

<input 
type="date" 
id="tglJadi">



<label>
Editor
</label>

<select id="editor">

<option value="">
Pilih Editor
</option>

<option>Topan</option>
<option>Admin</option>
<option>Dina</option>
<option>Diza</option>
<option>Farid</option>

</select>




<label>
Tanggal Review
</label>

<input 
type="date" 
id="review">



<label>
Tanggal ACC
</label>

<input 
type="date" 
id="acc">





<label>
Status Konten
</label>


<select id="status">


<option value="">
Pilih Status
</option>


<option>
On Process
</option>


<option>
Stock
</option>


<option>
Terupload
</option>


</select>





<label>
Keterangan
</label>


<textarea

id="keterangan"

rows="4"

placeholder="Tambahkan keterangan">

</textarea>





<button 
class="button"

onclick="simpanKonten()">

💾 Simpan Konten

</button>




</div>

</div>
