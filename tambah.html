<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tambah Konten - CBM Content Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    CBM Content Manager
</header>

<div class="container">

    <div class="card">

        <div class="title">
            ➕ Tambah Konten
        </div>

        <p>Silakan isi data konten baru.</p>

        <label for="judul">Judul Konten</label>
        <input
            type="text"
            id="judul"
            placeholder="Masukkan judul konten..."
            required>

        <label for="tglBahan">Tanggal Bahan Mentah Diterima</label>
        <input
            type="date"
            id="tglBahan"
            required>

        <label for="tglEdit">Tanggal Mulai Edit</label>
        <input
            type="date"
            id="tglEdit">

        <label for="tglJadi">Tanggal Jadi Konten</label>
        <input
            type="date"
            id="tglJadi">

        <label for="editor">Editor</label>
        <select id="editor" required>
            <option value="">-- Pilih Editor --</option>
            <option>Topan</option>
            <option>Admin</option>
            <option>Dina</option>
            <option>Diza</option>
            <option>Farid</option>
        </select>

        <label for="review">Tanggal Upload ke Grup Review</label>
        <input
            type="date"
            id="review">

        <label for="acc">Tanggal ACC</label>
        <input
            type="date"
            id="acc">

        <label for="status">Status</label>
        <select id="status">
            <option selected>On Process</option>
            <option>Stock</option>
            <option>Upload</option>
            <option>Booster</option>
        </select>

        <label for="keterangan">Keterangan</label>
        <textarea
            id="keterangan"
            rows="4"
            placeholder="Tambahkan catatan jika diperlukan..."></textarea>

        <button
            class="button"
            onclick="simpanKonten()">

            💾 Simpan Konten

        </button>

    </div>

</div>

<nav class="bottom-nav">

    <a href="index.html">
        🏠<br>Dashboard
    </a>

    <a href="onprocess.html">
        🟡<br>On Process
    </a>

    <a href="stock.html">
        📦<br>Stock
    </a>

    <a href="upload.html">
        🎬<br>Terupload
    </a>

    <a href="booster.html">
        🚀<br>Booster
    </a>

</nav>

<script src="script.js"></script>

</body>
</html>
