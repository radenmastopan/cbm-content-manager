<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Konten</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<header>
Laporan Konten
</header>

<div class="container">

<div class="card">

<h2>Tambah Laporan</h2>

<label>Judul Konten</label>
<input type="text" placeholder="Masukkan judul konten">

<br><br>

<label>Editor</label>
<select>

<option>Topan</option>
<option>Admin</option>
<option>Dina</option>
<option>Diza</option>
<option>Farid</option>

</select>

<br><br>

<label>Status</label>
<select>

<option>On Process</option>
<option>Stock Konten</option>
<option>Konten Terupload</option>
<option>Booster Live</option>

</select>

<br><br>

<label>Link TikTok</label>
<input
type="text"
placeholder="https://vt.tiktok.com/...">

<br><br>

<label>Keterangan</label>
<textarea
rows="4"
placeholder="Tulis keterangan..."></textarea>

<br><br>

<button class="button">

Simpan Laporan

</button>

</div>
</div>

<script src="script.js"></script>

</body>
</html>
